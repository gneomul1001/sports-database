<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>가상 스포츠 데이터베이스 관리 시스템</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0fdf4',
                            100: '#dcfce7',
                            500: '#22c55e',
                            600: '#16a34a',
                            700: '#15803d',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        /* Custom scrollbar for clean dashboard feel */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased">

    <div id="app" class="flex h-screen overflow-hidden">
        
        <!-- SIDEBAR -->
        <aside class="w-64 bg-slate-900 text-slate-300 flex flex-col flex-shrink-0 transition-all duration-300 z-20">
            <div class="h-16 flex items-center px-6 bg-slate-950 border-b border-slate-800">
                <i data-lucide="database" class="w-6 h-6 text-brand-500 mr-3"></i>
                <span class="font-bold text-lg text-white tracking-tight">Sports DB Admin</span>
            </div>
            <nav class="flex-1 px-4 py-6 space-y-1.5 overflow-y-auto">
                <button onclick="router.navigate('dashboard')" class="nav-btn w-full flex items-center px-4 py-3 rounded-lg text-sm font-medium transition-colors" data-target="dashboard">
                    <i data-lucide="layout-dashboard" class="w-5 h-5 mr-3"></i> 대시보드
                </button>
                <button onclick="router.navigate('sports')" class="nav-btn w-full flex items-center px-4 py-3 rounded-lg text-sm font-medium transition-colors" data-target="sports">
                    <i data-lucide="trophy" class="w-5 h-5 mr-3"></i> 스포츠 관리
                </button>
                <button onclick="router.navigate('leagues')" class="nav-btn w-full flex items-center px-4 py-3 rounded-lg text-sm font-medium transition-colors" data-target="leagues">
                    <i data-lucide="flag" class="w-5 h-5 mr-3"></i> 리그 관리
                </button>
                <button onclick="router.navigate('teams')" class="nav-btn w-full flex items-center px-4 py-3 rounded-lg text-sm font-medium transition-colors" data-target="teams">
                    <i data-lucide="shield" class="w-5 h-5 mr-3"></i> 팀 관리
                </button>
                <button onclick="router.navigate('players')" class="nav-btn w-full flex items-center px-4 py-3 rounded-lg text-sm font-medium transition-colors" data-target="players">
                    <i data-lucide="users" class="w-5 h-5 mr-3"></i> 선수 관리
                </button>
                <button onclick="router.navigate('relations')" class="nav-btn w-full flex items-center px-4 py-3 rounded-lg text-sm font-medium transition-colors" data-target="relations">
                    <i data-lucide="git-commit" class="w-5 h-5 mr-3"></i> 데이터 관계도
                </button>
                <button onclick="router.navigate('settings')" class="nav-btn w-full flex items-center px-4 py-3 rounded-lg text-sm font-medium transition-colors" data-target="settings">
                    <i data-lucide="settings" class="w-5 h-5 mr-3"></i> 설정
                </button>
            </nav>
            <div class="p-4 border-t border-slate-800 text-xs text-slate-500 text-center">
                Virtual Sports DB v1.0
            </div>
        </aside>

        <!-- MAIN CONTENT CONTAINER -->
        <div class="flex-1 flex flex-col min-w-0 overflow-hidden">
            
            <!-- TOP HEADER -->
            <header class="h-16 bg-white border-b border-slate-200 flex items-center justify-between px-8 flex-shrink-0 z-15">
                <div class="flex items-center space-x-3">
                    <h1 id="page-title" class="text-xl font-bold text-slate-800">대시보드</h1>
                </div>
                <div class="flex items-center space-x-4">
                    <span id="header-summary" class="text-sm bg-slate-100 text-slate-600 px-3 py-1.5 rounded-full font-medium">데이터 총계: 0건</span>
                </div>
            </header>

            <!-- VIEW CONTENT AREA -->
            <main id="main-content" class="flex-1 overflow-y-auto bg-slate-50 p-8">
                <!-- Dynamic Content injected here -->
            </main>
        </div>
    </div>

    <!-- GLOBAL MODAL CONTAINER -->
    <div id="modal-container" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center hidden">
        <div id="modal-content" class="bg-white rounded-xl shadow-2xl w-full max-w-2xl max-h-[90vh] overflow-y-auto m-4">
            <!-- Modal inner content -->
        </div>
    </div>

    <!-- TOAST NOTIFICATION -->
    <div id="toast-container" class="fixed bottom-6 right-6 z-50 space-y-2"></div>

    <script>
        /* ================= STORAGE & STATE MANAGEMENT ================= */
        const DB_KEY = 'VIRTUAL_SPORTS_DB_DATA_v1';
        
        let db = {
            sports: [],
            leagues: [],
            teams: [],
            players: []
        };

        function loadDB() {
            const stored = localStorage.getItem(DB_KEY);
            if (stored) {
                try {
                    db = JSON.parse(stored);
                } catch (e) {
                    console.error("Failed to parse DB", e);
                }
            }
        }

        function saveDB() {
            localStorage.setItem(DB_KEY, JSON.stringify(db));
        }

        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const bgColor = type === 'success' ? 'bg-emerald-600' : type === 'error' ? 'bg-rose-600' : 'bg-slate-800';
            toast.className = `${bgColor} text-white px-4 py-3 rounded-lg shadow-lg text-sm flex items-center space-x-2 transform translate-y-2 opacity-0 transition-all duration-300`;
            toast.innerHTML = `<i data-lucide="${type === 'success' ? 'check-circle' : 'alert-circle'}" class="w-4 h-4"></i><span>${message}</span>`;
            container.appendChild(toast);
            lucide.createIcons();

            setTimeout(() => {
                toast.classList.remove('translate-y-2', 'opacity-0');
            }, 10);

            setTimeout(() => {
                toast.classList.add('translate-y-2', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        /* ================= ROUTER ================= */
        const router = {
            currentView: 'dashboard',
            currentParam: null,
            navigate(view, param = null) {
                this.currentView = view;
                this.currentParam = param;
                
                // Update sidebar active state
                document.querySelectorAll('.nav-btn').forEach(btn => {
                    if (btn.dataset.target === view) {
                        btn.classList.add('bg-brand-600', 'text-white');
                        btn.classList.remove('text-slate-300', 'hover:bg-slate-800', 'hover:text-white');
                    } else {
                        btn.classList.remove('bg-brand-600', 'text-white');
                        btn.classList.add('text-slate-300', 'hover:bg-slate-800', 'hover:text-white');
                    }
                });

                renderView();
            }
        };

        function renderView() {
            const container = document.getElementById('main-content');
            const titleEl = document.getElementById('page-title');
            const summaryEl = document.getElementById('header-summary');

            const totalCount = db.sports.length + db.leagues.length + db.teams.length + db.players.length;
            summaryEl.textContent = `전체 데이터: ${totalCount}건`;

            container.innerHTML = '';

            switch (router.currentView) {
                case 'dashboard':
                    titleEl.textContent = '대시보드';
                    renderDashboard(container);
                    break;
                case 'sports':
                    titleEl.textContent = '스포츠 관리';
                    renderSportsManager(container);
                    break;
                case 'leagues':
                    titleEl.textContent = '리그 관리';
                    renderLeaguesManager(container);
                    break;
                case 'teams':
                    titleEl.textContent = '팀 관리';
                    renderTeamsManager(container);
                    break;
                case 'players':
                    titleEl.textContent = '선수 관리';
                    renderPlayersManager(container);
                    break;
                case 'relations':
                    titleEl.textContent = '데이터 관계도';
                    renderRelationsManager(container);
                    break;
                case 'settings':
                    titleEl.textContent = '시스템 설정';
                    renderSettingsManager(container);
                    break;
                default:
                    container.innerHTML = `<div class="text-slate-500">페이지를 찾을 수 없습니다.</div>`;
            }
            lucide.createIcons();
        }

        /* ================= 1. DASHBOARD VIEW ================= */
        function renderDashboard(container) {
            const sCount = db.sports.length;
            const lCount = db.leagues.length;
            const tCount = db.teams.length;
            const pCount = db.players.length;

            container.innerHTML = `
                <div class="space-y-8">
                    <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
                        <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between">
                            <div>
                                <p class="text-sm font-medium text-slate-500">등록 스포츠 수</p>
                                <h3 class="text-3xl font-bold text-slate-800 mt-1">${sCount}</h3>
                            </div>
                            <div class="w-12 h-12 bg-brand-50 rounded-lg flex items-center justify-center text-brand-600">
                                <i data-lucide="trophy" class="w-6 h-6"></i>
                            </div>
                        </div>
                        <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between">
                            <div>
                                <p class="text-sm font-medium text-slate-500">등록 리그 수</p>
                                <h3 class="text-3xl font-bold text-slate-800 mt-1">${lCount}</h3>
                            </div>
                            <div class="w-12 h-12 bg-blue-50 rounded-lg flex items-center justify-center text-blue-600">
                                <i data-lucide="flag" class="w-6 h-6"></i>
                            </div>
                        </div>
                        <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between">
                            <div>
                                <p class="text-sm font-medium text-slate-500">등록 팀 수</p>
                                <h3 class="text-3xl font-bold text-slate-800 mt-1">${tCount}</h3>
                            </div>
                            <div class="w-12 h-12 bg-amber-50 rounded-lg flex items-center justify-center text-amber-600">
                                <i data-lucide="shield" class="w-6 h-6"></i>
                            </div>
                        </div>
                        <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between">
                            <div>
                                <p class="text-sm font-medium text-slate-500">등록 선수 수</p>
                                <h3 class="text-3xl font-bold text-slate-800 mt-1">${pCount}</h3>
                            </div>
                            <div class="w-12 h-12 bg-purple-50 rounded-lg flex items-center justify-center text-purple-600">
                                <i data-lucide="users" class="w-6 h-6"></i>
                            </div>
                        </div>
                    </div>

                    <div class="bg-white rounded-xl border border-slate-200 shadow-sm p-6">
                        <h2 class="text-lg font-bold text-slate-800 mb-4">빠른 상태 및 안내</h2>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div class="p-4 bg-slate-50 rounded-lg border border-slate-100 flex items-center justify-between">
                                <div>
                                    <h4 class="font-semibold text-slate-700">스포츠 관리</h4>
                                    <p class="text-sm text-slate-500">${sCount === 0 ? '등록된 스포츠가 없습니다.' : `현재 ${sCount}개의 스포츠가 등록되어 있습니다.`}</p>
                                </div>
                                <button onclick="router.navigate('sports')" class="px-4 py-2 bg-brand-600 text-white rounded-lg text-sm font-medium hover:bg-brand-700 transition">관리하기</button>
                            </div>
                            <div class="p-4 bg-slate-50 rounded-lg border border-slate-100 flex items-center justify-between">
                                <div>
                                    <h4 class="font-semibold text-slate-700">리그 관리</h4>
                                    <p class="text-sm text-slate-500">${lCount === 0 ? '등록된 리그가 없습니다.' : `현재 ${lCount}개의 리그가 등록되어 있습니다.`}</p>
                                </div>
                                <button onclick="router.navigate('leagues')" class="px-4 py-2 bg-brand-600 text-white rounded-lg text-sm font-medium hover:bg-brand-700 transition">관리하기</button>
                            </div>
                            <div class="p-4 bg-slate-50 rounded-lg border border-slate-100 flex items-center justify-between">
                                <div>
                                    <h4 class="font-semibold text-slate-700">팀 관리</h4>
                                    <p class="text-sm text-slate-500">${tCount === 0 ? '등록된 팀이 없습니다.' : `현재 ${tCount}개의 팀이 등록되어 있습니다.`}</p>
                                </div>
                                <button onclick="router.navigate('teams')" class="px-4 py-2 bg-brand-600 text-white rounded-lg text-sm font-medium hover:bg-brand-700 transition">관리하기</button>
                            </div>
                            <div class="p-4 bg-slate-50 rounded-lg border border-slate-100 flex items-center justify-between">
                                <div>
                                    <h4 class="font-semibold text-slate-700">선수 관리</h4>
                                    <p class="text-sm text-slate-500">${pCount === 0 ? '등록된 선수가 없습니다.' : `현재 ${pCount}명의 선수가 등록되어 있습니다.`}</p>
                                </div>
                                <button onclick="router.navigate('players')" class="px-4 py-2 bg-brand-600 text-white rounded-lg text-sm font-medium hover:bg-brand-700 transition">관리하기</button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        /* ================= 2. SPORTS MANAGER ================= */
        function renderSportsManager(container, searchQuery = '') {
            const filtered = db.sports.filter(s => s.name.toLowerCase().includes(searchQuery.toLowerCase()));

            container.innerHTML = `
                <div class="space-y-6">
                    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                        <div class="w-full sm:w-72 relative">
                            <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3 top-3.5"></i>
                            <input type="text" id="sport-search" value="${searchQuery}" placeholder="스포츠 이름 검색..." oninput="filterSports(this.value)" class="w-full pl-9 pr-4 py-2 bg-white border border-slate-300 rounded-lg text-sm focus:outline-none focus:border-brand-500">
                        </div>
                        <button onclick="openSportModal()" class="flex items-center space-x-2 bg-brand-600 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-brand-700 transition">
                            <i data-lucide="plus" class="w-4 h-4"></i><span>스포츠 추가</span>
                        </button>
                    </div>

                    <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
                        ${filtered.length === 0 ? `
                            <div class="p-12 text-center">
                                <i data-lucide="trophy" class="w-12 h-12 text-slate-300 mx-auto mb-3"></i>
                                <p class="text-slate-500 font-medium">등록된 스포츠가 없습니다.</p>
                                <p class="text-slate-400 text-sm mt-1">새로운 스포츠를 추가하여 데이터베이스를 구축해보세요.</p>
                                <button onclick="openSportModal()" class="mt-4 px-4 py-2 bg-brand-600 text-white text-sm font-medium rounded-lg hover:bg-brand-700 transition">스포츠 추가하기</button>
                            </div>
                        ` : `
                            <div class="overflow-x-auto">
                                <table class="w-full text-left border-collapse">
                                    <thead>
                                        <tr class="bg-slate-50 border-b border-slate-200 text-slate-600 text-xs font-semibold uppercase tracking-wider">
                                            <th class="py-3.5 px-6">스포츠명</th>
                                            <th class="py-3.5 px-6">유형/분류</th>
                                            <th class="py-3.5 px-6">소속 리그 수</th>
                                            <th class="py-3.5 px-6">등록일</th>
                                            <th class="py-3.5 px-6 text-right">관리</th>
                                        </tr>
                                    </thead>
                                    <tbody class="divide-y divide-slate-200 text-sm">
                                        ${filtered.map(s => {
                                            const leaguesCount = db.leagues.filter(l => l.sportId === s.id).length;
                                            return `
                                                <tr class="hover:bg-slate-50/80 transition">
                                                    <td class="py-4 px-6 font-semibold text-slate-800">${s.name}</td>
                                                    <td class="py-4 px-6 text-slate-600">${s.type || '-'}</td>
                                                    <td class="py-4 px-6"><span class="bg-slate-100 text-slate-700 px-2.5 py-1 rounded-full text-xs font-medium">${leaguesCount}개 리그</span></td>
                                                    <td class="py-4 px-6 text-slate-500 text-xs">${s.createdAt}</td>
                                                    <td class="py-4 px-6 text-right space-x-2">
                                                        <button onclick="viewSportDetail('${s.id}')" class="text-slate-500 hover:text-slate-800 font-medium text-xs">상세</button>
                                                        <button onclick="openSportModal('${s.id}')" class="text-brand-600 hover:text-brand-700 font-medium text-xs">수정</button>
                                                        <button onclick="deleteSport('${s.id}')" class="text-rose-600 hover:text-rose-700 font-medium text-xs">삭제</button>
                                                    </td>
                                                </tr>
                                            `;
                                        }).join('')}
                                    </tbody>
                                </table>
                            </div>
                        `}
                    </div>
                </div>
            `;
        }

        function filterSports(val) {
            renderSportsManager(document.getElementById('main-content'), val);
        }

        function openSportModal(id = null) {
            const isEdit = id !== null;
            const sport = isEdit ? db.sports.find(s => s.id === id) : { name: '', type: '', description: '' };

            showModal(`
                <div class="p-6 border-b border-slate-200 flex justify-between items-center">
                    <h3 class="text-lg font-bold text-slate-800">${isEdit ? '스포츠 수정' : '스포츠 추가'}</h3>
                    <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600"><i data-lucide="x" class="w-5 h-5"></i></button>
                </div>
                <form id="sport-form" onsubmit="saveSport(event, '${id || ''}')" class="p-6 space-y-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">스포츠 이름 <span class="text-rose-500">*</span></label>
                        <input type="text" name="name" required value="${sport.name}" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:border-brand-500" placeholder="예: 축구, 야구">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">유형 또는 분류</label>
                        <input type="text" name="type" value="${sport.type || ''}" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:border-brand-500" placeholder="예: 구기 종목, 개인 종목">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">스포츠 설명</label>
                        <textarea name="description" rows="3" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:border-brand-500" placeholder="스포츠에 대한 설명을 입력하세요">${sport.description || ''}</textarea>
                    </div>
                    <div class="flex justify-end space-x-3 pt-4 border-t border-slate-100">
                        <button type="button" onclick="closeModal()" class="px-4 py-2 border border-slate-300 rounded-lg text-sm font-medium text-slate-700 hover:bg-slate-50">취소</button>
                        <button type="submit" class="px-4 py-2 bg-brand-600 text-white rounded-lg text-sm font-medium hover:bg-brand-700">저장</button>
                    </div>
                </form>
            `);
        }

        function saveSport(e, id) {
            e.preventDefault();
            const formData = new FormData(e.target);
            const name = formData.get('name').trim();
            const type = formData.get('type').trim();
            const description = formData.get('description').trim();

            if (!name) {
                showToast('스포츠 이름을 입력해주세요.', 'error');
                return;
            }

            // 중복 검사
            const duplicate = db.sports.find(s => s.name === name && s.id !== id);
            if (duplicate) {
                showToast('이미 존재하는 스포츠 이름입니다.', 'error');
                return;
            }

            if (id) {
                const sport = db.sports.find(s => s.id === id);
                sport.name = name;
                sport.type = type;
                sport.description = description;
                sport.updatedAt = new Date().toISOString().split('T')[0];
                showToast('스포츠가 수정되었습니다.');
            } else {
                const newSport = {
                    id: 'sport_' + Date.now(),
                    name,
                    type,
                    description,
                    createdAt: new Date().toISOString().split('T')[0]
                };
                db.sports.push(newSport);
                showToast('새 스포츠가 추가되었습니다.');
            }

            saveDB();
            closeModal();
            renderView();
        }

        function deleteSport(id) {
            const linkedLeagues = db.leagues.filter(l => l.sportId === id);
            if (linkedLeagues.length > 0) {
                if (!confirm(`경고: 이 스포츠에 속한 ${linkedLeagues.length}개의 리그 및 하위 팀/선수 데이터에 영향을 줄 수 있습니다. 정말 삭제하시겠습니까?`)) return;
                // 연관 데이터 전체 정리 (캐스케이딩)
                const leagueIds = linkedLeagues.map(l => l.id);
                db.leagues = db.leagues.filter(l => l.sportId !== id);
                const teamIds = db.teams.filter(t => leagueIds.includes(t.leagueId)).map(t => t.id);
                db.teams = db.teams.filter(t => !leagueIds.includes(t.leagueId));
                db.players = db.players.filter(p => !teamIds.includes(p.teamId));

        function saveLeague(e, id) {
            e.preventDefault();
            const formData = new FormData(e.target);
            const sportId = formData.get('sportId');
            const name = formData.get('name').trim();
            const shortName = formData.get('shortName').trim();
            const country = formData.get('country').trim();
            const foundedYear = formData.get('foundedYear').trim();
            const description = formData.get('description').trim();

            if (!sportId || !name || !country) {
                showToast('필수 항목을 모두 입력해주세요.', 'error');
                return;
            }

            if (id) {
                const league = db.leagues.find(l => l.id === id);
                league.sportId = sportId;
                league.name = name;
                league.shortName = shortName;
                league.country = country;
                league.foundedYear = foundedYear;
                league.description = description;
                showToast('리그가 수정되었습니다.');
            } else {
                const newLeague = {
                    id: 'league_' + Date.now(),
                    sportId,
                    name,
                    shortName,
                    country,
                    foundedYear,
                    description,
                    createdAt: new Date().toISOString().split('T')[0]
                };
                db.leagues.push(newLeague);
                showToast('새 리그가 추가되었습니다.');
            }

            saveDB();
            closeModal();
            renderView();
        }

        function deleteLeague(id) {
            const linkedTeams = db.teams.filter(t => t.leagueId === id);
            if (linkedTeams.length > 0) {
                if (!confirm(`경고: 이 리그에 속한 ${linkedTeams.length}개의 팀 및 소속 선수 데이터에 영향을 줄 수 있습니다. 정말 삭제하시겠습니까?`)) return;
                const teamIds = linkedTeams.map(t => t.id);
                db.teams = db.teams.filter(t => t.leagueId !== id);
                db.players = db.players.filter(p => !teamIds.includes(p.teamId));
            } else {
                if (!confirm('정말 이 리그를 삭제하시겠습니까?')) return;
            }

            db.leagues = db.leagues.filter(l => l.id !== id);
            saveDB();
            showToast('리그가 삭제되었습니다.');
            renderView();
        }

                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">팀 이름 <span class="text-rose-500">*</span></label>
                            <input type="text" name="name" required value="${team.name}" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:border-brand-500" placeholder="예: 맨체스터 유나이티드">
                        </div>
                        <div>

                            <label class="block text-xs font-semibold text-slate-600 mb-1">창단 연도</label>

                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">팀 로고 이미지 URL</label>
                        <input type="text" name="logoUrl" value="${team.logoUrl || ''}" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:border-brand-500" placeholder="https://example.com/logo.png">
                    </div>

                        <label class="block text-xs font-semibold text-slate-600 mb-1">팀 설명</label>
                        <textarea name="description" rows="3" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:border-brand-500" placeholder="팀 설명을 입력하세요">${team.description || ''}</textarea>

        function onTeamLeagueChange(selectEl) {
            const selectedOpt = selectEl.options[selectEl.selectedIndex];
            const country = selectedOpt.getAttribute('data-country') || '';
            const countryInput = document.getElementById('team-country-input');
            if (countryInput) countryInput.value = country;
        }

        function saveTeam(e, id) {
            e.preventDefault();
            const formData = new FormData(e.target);
            const leagueId = formData.get('leagueId');
            const name = formData.get('name').trim();
            const country = formData.get('country').trim();
            const region = formData.get('region').trim();
            const foundedYear = formData.get('foundedYear').trim();
            const logoUrl = formData.get('logoUrl').trim();
            const description = formData.get('description').trim();

            if (!leagueId || !name || !country || !region) {
                showToast('필수 항목을 모두 입력해주세요.', 'error');
                return;
            }

            if (id) {
                const team = db.teams.find(t => t.id === id);
                team.leagueId = leagueId;
                team.name = name;
                team.country = country;
                team.region = region;
                team.foundedYear = foundedYear;
                team.logoUrl = logoUrl;
                team.description = description;
                showToast('팀 정보가 수정되었습니다.');
            } else {
                const newTeam = {
                    id: 'team_' + Date.now(),
                    leagueId,
                    name,
                    country,
                    region,
                    foundedYear,
                    logoUrl,
                    description,
                    createdAt: new Date().toISOString().split('T')[0]
                };
                db.teams.push(newTeam);
                showToast('새 팀이 추가되었습니다.');
            }

            saveDB();
            closeModal();
            renderView();
        }

        function deleteTeam(id) {
            const linkedPlayers = db.players.filter(p => p.teamId === id);
            if (linkedPlayers.length > 0) {
                if (!confirm(`경고: 이 팀에 소속된 ${linkedPlayers.length명의 선수가 함께 삭제됩니다. 정말 삭제하시겠습니까?`)) return;
                db.players = db.players.filter(p => p.teamId !== id);
            } else {
                if (!confirm('정말 이 팀을 삭제하시겠습니까?')) return;
            }

            db.teams = db.teams.filter(t => t.id !== id);
            saveDB();
            showToast('팀이 삭제되었습니다.');
            renderView();
        }

        function viewTeamDetail(id) {
            const team = db.teams.find(t => t.id === id);
            const league = db.leagues.find(l => l.id === team.leagueId);
            const players = db.players.filter(p => p.teamId === id);

            showModal(`
                <div class="p-6 border-b border-slate-200 flex justify-between items-center">
                    <div class="flex items-center space-x-3">
                        ${team.logoUrl ? `<img src="${team.logoUrl}" class="w-10 h-10 object-contain rounded bg-slate-100" />` : `<div class="w-10 h-10 bg-slate-100 rounded flex items-center justify-center font-bold text-slate-400">${team.name[0]}</div>`}
                        <div>
                            <span class="text-xs font-semibold text-brand-600 uppercase tracking-wider">팀 상세</span>
                            <h3 class="text-xl font-bold text-slate-800">${team.name}</h3>
                        </div>
                    </div>
                    <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600"><i data-lucide="x" class="w-5 h-5"></i></button>
                </div>
                <div class="p-6 space-y-6">
                    <div class="grid grid-cols-4 gap-4 text-sm">
                        <div class="p-3 bg-slate-50 rounded-lg">
                            <span class="block text-xs font-semibold text-slate-400">소속 리그</span>
                            <span class="font-medium text-slate-700">${league ? league.name : '-'}</span>
                        </div>
                        <div class="p-3 bg-slate-50 rounded-lg">
                            <span class="block text-xs font-semibold text-slate-400">국가 / 지역</span>
                            <span class="font-medium text-slate-700">${team.country} / ${team.region}</span>
                        </div>
                        <div class="p-3 bg-slate-50 rounded-lg">
                            <span class="block text-xs font-semibold text-slate-400">창단연도</span>
                            <span class="font-medium text-slate-700">${team.foundedYear || '-'}</span>
                        </div>
                        <div class="p-3 bg-slate-50 rounded-lg">
                            <span class="block text-xs font-semibold text-slate-400">선수단 규모</span>
                            <span class="font-medium text-slate-700">${players.length}명</span>
                        </div>
                    </div>
                    <div>
                        <h4 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">설명</h4>
                        <p class="text-sm text-slate-600 bg-slate-50 p-3 rounded-lg">${team.description || '등록된 설명이 없습니다.'}</p>
                    </div>
                    <div>
                        <h4 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">소속 선수 목록 (${players.length})</h4>
                        ${players.length === 0 ? '<p class="text-sm text-slate-400">소속된 선수가 없습니다.</p>' : `
                            <div class="space-y-2">
                                ${players.map(p => `<div class="p-3 bg-slate-50 rounded-lg text-sm flex justify-between items-center"><span class="font-medium">${p.name} (#${p.backNumber || '-'})</span><span class="text-xs text-slate-500">${p.position} / ${p.nationality}</span></div>`).join('')}
                            </div>
                        `}
                    </div>
                </div>
            `);
        }

        /* ================= 5. PLAYERS MANAGER ================= */
        function renderPlayersManager(container, searchQuery = '', teamFilter = '') {
            const filtered = db.players.filter(p => {
                const matchName = p.name.toLowerCase().includes(searchQuery.toLowerCase()) || p.nationality.toLowerCase().includes(searchQuery.toLowerCase());
                const matchTeam = teamFilter ? p.teamId === teamFilter : true;
                return matchName && matchTeam;
            });

            container.innerHTML = `
                <div class="space-y-6">
                    <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                        <div class="flex flex-wrap gap-3 w-full md:w-auto">
                            <div class="w-full sm:w-60 relative">
                                <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3 top-3.5"></i>

                            </div>
                            <select id="player-team-filter" onchange="filterPlayers()" class="px-3 py-2 bg-white border border-slate-300 rounded-lg text-sm focus:outline-none focus:border-brand-500">

                            </select>

                            <i data-lucide="plus" class="w-4 h-4"></i><span>선수 추가</span>
                        </button>
                    </div>

                    <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
                        ${filtered.length === 0 ? `
                            <div class="p-12 text-center">
                                <i data-lucide="users" class="w-12 h-12 text-slate-300 mx-auto mb-3"></i>
                                <p class="text-slate-500 font-medium">등록된 선수가 없습니다.</p>
                                <p class="text-slate-400 text-sm mt-1">팀을 먼저 등록한 뒤 선수를 추가할 수 있습니다.</p>
                                <button onclick="openPlayerModal()" class="mt-4 px-4 py-2 bg-brand-600 text-white text-sm font-medium rounded-lg hover:bg-brand-700 transition">선수 추가하기</button>

                            <div class="overflow-x-auto">
                                <table class="w-full text-left border-collapse">
                                    <thead>
                                        <tr class="bg-slate-50 border-b border-slate-200 text-slate-600 text-xs font-semibold uppercase tracking-wider">

                                            <th class="py-3.5 px-6">소속 팀</th>
                                            <th class="py-3.5 px-6">포지션</th>
                                            <th class="py-3.5 px-6">등번호</th>
                                            <th class="py-3.5 px-6">국적</th>
                                            <th class="py-3.5 px-6 text-right">관리</th>
                                        </tr>
                                    </thead>
                                    <tbody class="divide-y divide-slate-200 text-sm">
                                        ${filtered.map(p => {
                                            const team = db.teams.find(t => t.id === p.teamId);
                                            return `
                                                <tr class="hover:bg-slate-50/80 transition">
                                                    <td class="py-4 px-6 font-semibold text-slate-800 flex items-center space-x-3">
                                                        ${p.profileUrl ? `<img src="${p.profileUrl}" class="w-7 h-7 object-cover rounded-full bg-slate-100" />` : `<div class="w-7 h-7 bg-slate-100 rounded-full flex items-center justify-center text-xs font-bold text-slate-400">${p.name[0]}</div>`}
                                                        <span>${p.name}</span>
                                                    </td>
                                                    <td class="py-4 px-6 text-slate-600">${team ? team.name : '삭제된 팀'}</td>

                                                        <button onclick="openPlayerModal('${p.id}')" class="text-brand-600 hover:text-brand-700 font-medium text-xs">수정</button>
                                                        <button onclick="deletePlayer('${p.id}')" class="text-rose-600 hover:text-rose-700 font-medium text-xs">삭제</button>

                                                </tr>
                                            `;
                                        }).join('')}
                                    </tbody>
                                </table>
                            </div>
                        `}
                    </div>
                </div>
            `;
        }

        function filterPlayers() {
            const search = document.getElementById('player-search').value;
            const teamFilter = document.getElementById('player-team-filter').value;
            renderPlayersManager(document.getElementById('main-content'), search, teamFilter);
        }

        function openPlayerModal(id = null) {
            const isEdit = id !== null;
            const player = isEdit ? db.players.find(p => p.id === id) : { name: '', teamId: '', nationality: '', position: '', backNumber: '', birthDate: '', profileUrl: '', description: '' };

            // 계층형 선택 (스포츠 -> 리그 -> 팀)을 위한 초기값 계산
            let initialSportId = '';
            let initialLeagueId = '';
            if (isEdit && player.teamId) {
                const t = db.teams.find(x => x.id === player.teamId);
                if (t) {
                    initialLeagueId = t.leagueId;
                    const l = db.leagues.find(x => x.id === t.leagueId);
                    if (l) initialSportId = l.sportId;
                }
            }

            showModal(`
                <div class="p-6 border-b border-slate-200 flex justify-between items-center">
                    <h3 class="text-lg font-bold text-slate-800">${isEdit ? '선수 수정' : '선수 추가'}</h3>
                    <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600"><i data-lucide="x" class="w-5 h-5"></i></button>
                </div>
                <form onsubmit="savePlayer(event, '${id || ''}')" class="p-6 space-y-4">
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-3 bg-slate-50 p-4 rounded-lg border border-slate-200">
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">1. 스포츠 선택</label>
                            <select id="cascading-sport" onchange="onSportCascadeChange(this.value)" class="w-full px-2.5 py-1.5 border border-slate-300 rounded bg-white text-sm">
                                <option value="">스포츠 선택</option>
                                ${db.sports.map(s => `<option value="${s.id}" ${initialSportId === s.id ? 'selected' : ''}>${s.name}</option>`).join('')}
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">2. 리그 선택</label>
                            <select id="cascading-league" onchange="onLeagueCascadeChange(this.value)" class="w-full px-2.5 py-1.5 border border-slate-300 rounded bg-white text-sm">
                                <option value="">리그 선택</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">3. 소속 팀 <span class="text-rose-500">*</span></label>
                            <select name="teamId" id="cascading-team" required class="w-full px-2.5 py-1.5 border border-slate-300 rounded bg-white text-sm">
                                <option value="">팀 선택</option>
                            </select>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">선수 이름 <span class="text-rose-500">*</span></label>
                            <input type="text" name="name" required value="${player.name}" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:border-brand-500" placeholder="예: 손흥민">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">국적 <span class="text-rose-500">*</span></label>
                            <input type="text" name="nationality" required value="${player.nationality}" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:border-brand-500" placeholder="예: 대한민국">
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">포지션</label>
                            <input type="text" name="position" value="${player.position || ''}" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:border-brand-500" placeholder="예: FW, MF">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">등번호</label>
                            <input type="number" name="backNumber" value="${player.backNumber || ''}" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:border-brand-500" placeholder="예: 7">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">생년월일</label>
                            <input type="date" name="birthDate" value="${player.birthDate || ''}" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:border-brand-500">
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">프로필 이미지 URL</label>
                        <input type="text" name="profileUrl" value="${player.profileUrl || ''}" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:border-brand-500" placeholder="https://example.com/profile.png">
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">선수 설명</label>
                        <textarea name="description" rows="3" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:border-brand-500" placeholder="선수 설명을 입력하세요">${player.description || ''}</textarea>
                    </div>

                    <div class="flex justify-end space-x-3 pt-4 border-t border-slate-100">
                        <button type="button" onclick="closeModal()" class="px-4 py-2 border border-slate-300 rounded-lg text-sm font-medium text-slate-700 hover:bg-slate-50">취소</button>
                        <button type="submit" class="px-4 py-2 bg-brand-600 text-white rounded-lg text-sm font-medium hover:bg-brand-700">저장</button>
                    </div>
                </form>
            `);

            // Initialize cascading dropdowns
            if (initialSportId) {
                onSportCascadeChange(initialSportId, initialLeagueId);
                if (initialLeagueId) {
                    onLeagueCascadeChange(initialLeagueId, player.teamId);
                }
            }
        }

        function onSportCascadeChange(sportId, selectedLeagueId = '') {
            const leagueSelect = document.getElementById('cascading-league');
            const teamSelect = document.getElementById('cascading-team');
            leagueSelect.innerHTML = '<option value="">리그 선택</option>';
            teamSelect.innerHTML = '<option value="">팀 선택</option>';

            if (!sportId) return;

            const leagues = db.leagues.filter(l => l.sportId === sportId);
            leagues.forEach(l => {
                const opt = document.createElement('option');
                opt.value = l.id;
                opt.textContent = l.name + ' (' + l.country + ')';
                if (l.id === selectedLeagueId) opt.selected = true;
                leagueSelect.appendChild(opt);
            });
        }

        function onLeagueCascadeChange(leagueId, selectedTeamId = '') {
            const teamSelect = document.getElementById('cascading-team');
            teamSelect.innerHTML = '<option value="">팀 선택</option>';

            if (!leagueId) return;

            const teams = db.teams.filter(t => t.leagueId === leagueId);
            teams.forEach(t => {
                const opt = document.createElement('option');
                opt.value = t.id;
                opt.textContent = t.name + ' (' + t.region + ')';
                if (t.id === selectedTeamId) opt.selected = true;
                teamSelect.appendChild(opt);
            });
        }

        function savePlayer(e, id) {
            e.preventDefault();
            const formData = new FormData(e.target);
            const teamId = formData.get('teamId');
            const name = formData.get('name').trim();
            const nationality = formData.get('nationality').trim();

            const backNumber = formData.get('backNumber').trim();

            const description = formData.get('description').trim();

            if (!teamId || !name || !nationality) {
                showToast('필수 항목을 모두 입력해주세요.', 'error');
                return;
            }

            if (id) {
                const player = db.players.find(p => p.id === id);
                player.teamId = teamId;
                player.name = name;
                player.nationality = nationality;
                player.position = position;
                player.backNumber = backNumber;
                player.birthDate = birthDate;
                player.profileUrl = profileUrl;
                player.description = description;
                showToast('선수 정보가 수정되었습니다.');
            } else {
                const newPlayer = {
                    id: 'player_' + Date.now(),
                    teamId,
                    name,
                    nationality,
                    position,
                    backNumber,
                    birthDate,
                    profileUrl,
                    description,
                    createdAt: new Date().toISOString().split('T')[0]
                };
                db.players.push(newPlayer);
                showToast('새 선수가 추가되었습니다.');
            }

            saveDB();
            closeModal();
            renderView();
        }

        function deletePlayer(id) {
            if (!confirm('정말 이 선수를 삭제하시겠습니까?')) return;
            db.players = db.players.filter(p => p.id !== id);
            saveDB();
            showToast('선수가 삭제되었습니다.');
            renderView();
        }

        function viewPlayerDetail(id) {
            const player = db.players.find(p => p.id === id);
            const team = db.teams.find(t => t.id === player.teamId);

            showModal(`
                <div class="p-6 border-b border-slate-200 flex justify-between items-center">
                    <div class="flex items-center space-x-3">
                        ${player.profileUrl ? `<img src="${player.profileUrl}" class="w-10 h-10 object-cover rounded-full bg-slate-100" />` : `<div class="w-10 h-10 bg-slate-100 rounded-full flex items-center justify-center font-bold text-slate-400">${player.name[0]}</div>`}
                        <div>
                            <span class="text-xs font-semibold text-brand-600 uppercase tracking-wider">선수 상세</span>
                            <h3 class="text-xl font-bold text-slate-800">${player.name}</h3>
                        </div>
                    </div>
                    <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600"><i data-lucide="x" class="w-5 h-5"></i></button>
                </div>
                <div class="p-6 space-y-6">
                    <div class="grid grid-cols-4 gap-4 text-sm">
                        <div class="p-3 bg-slate-50 rounded-lg">
                            <span class="block text-xs font-semibold text-slate-400">소속 팀</span>
                            <span class="font-medium text-slate-700">${team ? team.name : '-'}</span>
                        </div>
                        <div class="p-3 bg-slate-50 rounded-lg">
                            <span class="block text-xs font-semibold text-slate-400">포지션 / 등번호</span>
                            <span class="font-medium text-slate-700">${player.position || '-'} / #${player.backNumber || '-'}</span>
                        </div>
                        <div class="p-3 bg-slate-50 rounded-lg">
                            <span class="block text-xs font-semibold text-slate-400">국적</span>
                            <span class="font-medium text-slate-700">${player.nationality}</span>
                        </div>
                        <div class="p-3 bg-slate-50 rounded-lg">
                            <span class="block text-xs font-semibold text-slate-400">생년월일</span>
                            <span class="font-medium text-slate-700">${player.birthDate || '-'}</span>
                        </div>
                    </div>
                    <div>
                        <h4 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">설명</h4>
                        <p class="text-sm text-slate-600 bg-slate-50 p-3 rounded-lg">${player.description || '등록된 설명이 없습니다.'}</p>
                    </div>
                </div>
            `);
        }

        /* ================= 6. DATA RELATIONS MAP ================= */
        function renderRelationsManager(container) {
            container.innerHTML = `
                <div class="space-y-6">
                    <div class="bg-white rounded-xl border border-slate-200 shadow-sm p-6">
                        <h2 class="text-lg font-bold text-slate-800 mb-2">스포츠 데이터 계층 관계도</h2>
                        <p class="text-sm text-slate-500 mb-6">등록된 스포츠, 리그, 팀, 선수 간의 연결 구조를 계층형으로 확인합니다.</p>

                        ${db.sports.length === 0 ? `
                            <div class="p-12 text-center border border-dashed border-slate-200 rounded-lg">
                                <i data-lucide="git-commit" class="w-12 h-12 text-slate-300 mx-auto mb-3"></i>
                                <p class="text-slate-500 font-medium">표시할 데이터 관계가 없습니다.</p>
                                <p class="text-slate-400 text-sm mt-1">스포츠부터 순서대로 데이터를 등록해주세요.</p>
                            </div>
                        ` : `
                            <div class="space-y-6">
                                ${db.sports.map(s => {
                                    const leagues = db.leagues.filter(l => l.sportId === s.id);
                                    return `
                                        <div class="border border-slate-200 rounded-xl p-4 bg-slate-50">
                                            <div class="flex items-center space-x-2 pb-3 border-b border-slate-200">
                                                <i data-lucide="trophy" class="w-5 h-5 text-brand-600"></i>
                                                <span class="font-bold text-slate-800">${s.name}</span>
                                                <span class="text-xs bg-brand-100 text-brand-800 px-2 py-0.5 rounded-full font-medium">리그 ${leagues.length}개</span>
                                            </div>
                                            <div class="pl-6 pt-3 space-y-4">
                                                ${leagues.length === 0 ? '<p class="text-xs text-slate-400">하위 리그가 없습니다.</p>' : leagues.map(l => {
                                                    const teams = db.teams.filter(t => t.leagueId === l.id);
                                                    return `
                                                        <div class="border-l-2 border-brand-500 pl-4 space-y-2">
                                                            <div class="flex items-center space-x-2">
                                                                <i data-lucide="flag" class="w-4 h-4 text-blue-600"></i>
                                                                <span class="font-semibold text-slate-700">${l.name}</span>
                                                                <span class="text-xs text-slate-500">(${l.country})</span>
                                                                <span class="text-xs bg-blue-100 text-blue-800 px-2 py-0.5 rounded-full font-medium">팀 ${teams.length}개</span>
                                                            </div>
                                                            <div class="pl-6 space-y-2">
                                                                ${teams.length === 0 ? '<p class="text-xs text-slate-400">하위 팀이 없습니다.</p>' : teams.map(t => {
                                                                    const players = db.players.filter(p => p.teamId === t.id);
                                                                    return `
                                                                        <div class="bg-white p-3 rounded-lg border border-slate-200 shadow-xs space-y-2">
                                                                            <div class="flex items-center justify-between">
                                                                                <div class="flex items-center space-x-2">
                                                                                    <i data-lucide="shield" class="w-4 h-4 text-amber-600"></i>
                                                                                    <span class="font-semibold text-slate-800 text-sm">${t.name}</span>
                                                                                    <span class="text-xs text-slate-500">[${t.region}]</span>
                                                                                </div>
                                                                                <span class="text-xs bg-amber-100 text-amber-800 px-2 py-0.5 rounded-full font-medium">선수 ${players.length}명</span>
                                                                            </div>
                                                                            <div class="pl-6 flex flex-wrap gap-2 pt-1">
                                                                                ${players.length === 0 ? '<span class="text-xs text-slate-400">등록된 선수가 없습니다.</span>' : players.map(p => `
                                                                                    <span class="inline-flex items-center space-x-1 bg-slate-100 text-slate-700 px-2 py-1 rounded text-xs">
                                                                                        <i data-lucide="user" class="w-3 h-3 text-slate-400"></i>
                                                                                        <span>${p.name} #${p.backNumber || '-'}</span>
                                                                                    </span>
                                                                                `).join('')}
                                                                            </div>
                                                                        </div>
                                                                    `;
                                                                }).join('')}
                                                            </div>
                                                        </div>
                                                    `;
                                                }).join('')}
                                            </div>
                                        </div>
                                    `;
                                }).join('')}
                            </div>
                        `}
                    </div>
                </div>
            `;
        }

        /* ================= 7. SETTINGS MANAGER ================= */
        function renderSettingsManager(container) {
            container.innerHTML = `
                <div class="space-y-6 max-w-2xl">
                    <div class="bg-white rounded-xl border border-slate-200 shadow-sm p-6 space-y-6">
                        <h2 class="text-lg font-bold text-slate-800">데이터 관리 및 설정</h2>
                        
                        <div class="space-y-4">
                            <div class="p-4 bg-slate-50 rounded-lg border border-slate-200 flex items-center justify-between">
                                <div>
                                    <h4 class="font-semibold text-slate-700">데이터 초기화</h4>
                                    <p class="text-sm text-slate-500">저장된 모든 스포츠, 리그, 팀, 선수 데이터를 완전히 삭제합니다.</p>
                                </div>
                                <button onclick="resetAllData()" class="px-4 py-2 bg-rose-600 text-white rounded-lg text-sm font-medium hover:bg-rose-700 transition">전체 초기화</button>
                            </div>

                            <div class="p-4 bg-slate-50 rounded-lg border border-slate-200 flex items-center justify-between">
                                <div>
                                    <h4 class="font-semibold text-slate-700">데이터 백업 (JSON 내보내기)</h4>
                                    <p class="text-sm text-slate-500">현재 데이터베이스를 JSON 파일로 다운로드합니다.</p>
                                </div>
                                <button onclick="exportData()" class="px-4 py-2 bg-slate-800 text-white rounded-lg text-sm font-medium hover:bg-slate-900 transition">내보내기</button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function resetAllData() {
            if (!confirm('경고: 모든 데이터가 영구적으로 삭제됩니다. 계속하시겠습니까?')) return;
            db = { sports: [], leagues: [], teams: [], players: [] };
            saveDB();
            showToast('데이터가 초기화되었습니다.', 'error');
            renderView();
        }

        function exportData() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(db, null, 2));
            const dlAnchor = document.createElement('a');
            dlAnchor.setAttribute("href", dataStr);
            dlAnchor.setAttribute("download", `virtual_sports_db_${new Date().toISOString().split('T')[0]}.json`);
            document.body.appendChild(dlAnchor);
            dlAnchor.click();
            dlAnchor.remove();
            showToast('데이터가 백업되었습니다.');
        }

        /* ================= MODAL HELPERS ================= */
        function showModal(htmlContent) {
            const container = document.getElementById('modal-container');
            const content = document.getElementById('modal-content');
            content.innerHTML = htmlContent;
            container.classList.remove('hidden');
            lucide.createIcons();
        }

        function closeModal() {
            const container = document.getElementById('modal-container');
            container.classList.add('hidden');
        }

        // Close modal when clicking outside
        window.onclick = function(event) {
            const container = document.getElementById('modal-container');
            if (event.target === container) {
                closeModal();
            }
        };

        /* ================= INITIALIZATION ================= */
        window.addEventListener('DOMContentLoaded', () => {
            loadDB();
            router.navigate('dashboard');
        });
    </script>
</body>
</html>
